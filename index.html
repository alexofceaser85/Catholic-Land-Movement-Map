<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLM Chapter Contacts Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#1f2a24; --paper:#f6f7f4; --line:#d5dad2; --accent:#2f6b4f; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  button, select { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled, select:disabled { opacity:.5; cursor:default; }
  button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #status { margin-left:auto; color:#5b665f; font-size:13px; }
  #map { flex:1; min-height:0; }
  .popup h3 { margin:0 0 2px; font-size:15px; }
  .popup .meta { color:#5b665f; margin-bottom:6px; }
  .popup .msg { max-height:110px; overflow:auto; white-space:pre-wrap; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>CLM Chapter Contacts Map</h1>
  <button class="primary" id="load">Load CSV</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
  <select id="state" aria-label="State"></select>
  <select id="filter" aria-label="Filter by status" disabled><option value="">All statuses</option></select>
  <button id="export" disabled>Export view as PNG</button>
  <span id="status">Load a CSV to begin.</span>
</header>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

const STATES = `AL:Alabama:30.22,-88.47,35.01,-84.89|AK:Alaska:51.2,-170,71.4,-130|AZ:Arizona:31.33,-114.82,37.0,-109.05|AR:Arkansas:33.0,-94.62,36.5,-89.64|CA:California:32.53,-124.41,42.01,-114.13|CO:Colorado:36.99,-109.06,41.0,-102.04|CT:Connecticut:40.98,-73.73,42.05,-71.79|DE:Delaware:38.45,-75.79,39.84,-75.05|DC:District of Columbia:38.79,-77.12,38.99,-76.91|FL:Florida:24.4,-87.63,31.0,-80.03|GA:Georgia:30.36,-85.61,35.0,-80.84|HI:Hawaii:18.91,-160.25,22.24,-154.81|ID:Idaho:41.99,-117.24,49.0,-111.04|IL:Illinois:36.97,-91.51,42.51,-87.02|IN:Indiana:37.77,-88.1,41.76,-84.78|IA:Iowa:40.38,-96.64,43.5,-90.14|KS:Kansas:36.99,-102.05,40.0,-94.59|KY:Kentucky:36.5,-89.57,39.15,-81.96|LA:Louisiana:28.93,-94.04,33.02,-88.82|ME:Maine:43.06,-71.08,47.46,-66.95|MD:Maryland:37.91,-79.49,39.72,-75.05|MA:Massachusetts:41.24,-73.5,42.89,-69.93|MI:Michigan:41.7,-90.42,48.31,-82.12|MN:Minnesota:43.5,-97.24,49.38,-89.49|MS:Mississippi:30.17,-91.65,35.0,-88.1|MO:Missouri:35.99,-95.77,40.61,-89.1|MT:Montana:44.36,-116.05,49.0,-104.04|NE:Nebraska:40.0,-104.05,43.0,-95.31|NV:Nevada:35.0,-120.0,42.0,-114.04|NH:New Hampshire:42.7,-72.56,45.31,-70.7|NJ:New Jersey:38.93,-75.56,41.36,-73.89|NM:New Mexico:31.33,-109.05,37.0,-103.0|NY:New York:40.5,-79.76,45.02,-71.86|NC:North Carolina:33.84,-84.32,36.59,-75.46|ND:North Dakota:45.94,-104.05,49.0,-96.55|OH:Ohio:38.4,-84.82,41.98,-80.52|OK:Oklahoma:33.62,-103.0,37.0,-94.43|OR:Oregon:41.99,-124.57,46.29,-116.46|PA:Pennsylvania:39.72,-80.52,42.27,-74.69|RI:Rhode Island:41.15,-71.86,42.02,-71.12|SC:South Carolina:32.03,-83.35,35.22,-78.54|SD:South Dakota:42.48,-104.06,45.95,-96.44|TN:Tennessee:34.98,-90.31,36.68,-81.65|TX:Texas:25.84,-106.65,36.5,-93.51|UT:Utah:37.0,-114.05,42.0,-109.04|VT:Vermont:42.73,-73.44,45.02,-71.46|VA:Virginia:36.54,-83.68,39.47,-75.24|WA:Washington:45.54,-124.85,49.0,-116.92|WV:West Virginia:37.2,-82.64,40.64,-77.72|WI:Wisconsin:42.49,-92.89,47.31,-86.25|WY:Wyoming:41.0,-111.06,45.01,-104.05`
  .split('|').map(s => {
    const [code, name, b] = s.split(':'), n = b.split(',').map(Number);
    return { code, name, bounds: [[n[0], n[1]], [n[2], n[3]]] };
  });
const US_BOUNDS = [[24.4, -125], [49.4, -66.9]];
const DEFAULT_STATE = 'GA';

function stateCode(p) {
  const s = (p['State/Province'] || '').trim();
  if (!s) return '';
  const hit = STATES.find(x => x.code === s.toUpperCase() || x.name.toLowerCase() === s.toLowerCase());
  return hit ? hit.code : '?';
}
const inBounds = ([lat, lng], [[s, w], [n, e]]) => lat >= s && lat <= n && lng >= w && lng <= e;

const map = L.map('map', { zoomSnap: 0.5 }).fitBounds(STATES.find(s => s.code === DEFAULT_STATE).bounds);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  crossOrigin: true,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('state').innerHTML = '<option value="ALL">All locations</option>' +
  STATES.map(s => `<option value="${s.code}">${s.name}</option>`).join('');
$('state').value = DEFAULT_STATE;

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(f); f = ''; rows.push(row); row = [];
    } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r =>
    Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

let cache = {};
try { cache = JSON.parse(localStorage.getItem('geo-cache-v2') || '{}'); } catch (e) {}
const saveCache = () => { try { localStorage.setItem('geo-cache-v2', JSON.stringify(cache)); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isUS = c => /^(|us|usa|united states|united states of america)$/i.test(c.trim());

function centroid(places) {
  const pts = places.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]).filter(p => !isNaN(p[0]));
  if (!pts.length) return null;
  return [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
}

async function zippo(path) {
  let res;
  try { res = await fetch('https://api.zippopotam.us/us/' + path); }
  catch (e) { return undefined; }
  if (res.status === 404) return null;
  if (!res.ok) return undefined;
  return centroid((await res.json()).places || []);
}

let lastNominatim = 0;
async function nominatim(q) {
  const wait = lastNominatim + 1100 - Date.now();
  if (wait > 0) await sleep(wait);
  lastNominatim = Date.now();
  const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
  if (!res.ok) throw new Error('Geocoder returned ' + res.status);
  const d = await res.json();
  return d[0] ? [parseFloat(d[0].lat), parseFloat(d[0].lon)] : null;
}

async function locate(p) {
  const country = p['Country'] || 'United States';
  const city = p['Nearest City/Town'], zip = p['Postal Code'], state = p['State/Province'];
  if (!city && !zip) return null;
  const us = isUS(country);

  if (city && state) {
    const key = `c|${city}|${state}|${country}`.toLowerCase();
    if (!(key in cache)) { 
      var location = await nominatim(`${city}, ${state}, ${country}`); 
      if (location === null) {
        return null;
      }
      cache[key] = location;
      saveCache(); }
    if (cache[key]) return cache[key];
  }
  if (zip) {
    const key = `z|${zip}|${country}`.toLowerCase();
    if (!(key in cache)) {
      const r = us ? await zippo(zip.slice(0, 5)) : await nominatim(`${zip}, ${country}`);
      if (r === undefined) return null; 
      cache[key] = r; saveCache();
    }
    return cache[key];
  }
  return null;
}

const layer = L.layerGroup().addTo(map);
let records = [];       
const palette = ['#2f6b4f', '#c2410c', '#1d4ed8', '#a21caf', '#b45309', '#0f766e', '#be123c', '#4d7c0f'];
const colorFor = {};

function jitter(name, [lat, lng]) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const a = (h % 360) * Math.PI / 180, d = 0.004 + (Math.abs(h) % 100) / 100 * 0.01;
  return [lat + Math.sin(a) * d, lng + Math.cos(a) * d];
}

function popupHTML(p) {
  const place = [p['Nearest City/Town'], p['State/Province']].filter(Boolean).join(', ');
  return `<div class="popup">
    <h3>${esc(p['Full Name'])}</h3>
    <div class="meta">${esc(p['Status'])}${place ? ' · ' + esc(place) : ''}${p['Diocese'] ? ' · ' + esc(p['Diocese']) : ''}</div>
    ${p['Email'] ? `<div><a href="mailto:${esc(p['Email'])}">${esc(p['Email'])}</a></div>` : ''}
    ${p['Phone Number'] ? `<div>${esc(p['Phone Number'])}</div>` : ''}
    ${p['Added'] ? `<div class="meta">Added ${esc(p['Added'])}</div>` : ''}
    ${p['Message'] ? `<div class="msg">${esc(p['Message'])}</div>` : ''}
    ${p['Notes'] ? `<div class="msg">${esc(p['Notes'])}</div>` : ''}
  </div>`;
}

function addRecord(p, latlng) {
  const status = p['Status'] || 'Unknown';
  colorFor[status] ??= palette[Object.keys(colorFor).length % palette.length];
  const color = colorFor[status];
  const ll = jitter(p['Full Name'] || '', latlng);
  const marker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95 })
    .bindPopup(popupHTML(p));
  records.push({ person: p, latlng: ll, color, marker });
  marker.addTo(layer);
}

function refreshFilter() {
  const sel = $('filter'), cur = sel.value;
  sel.innerHTML = '<option value="">All statuses</option>' +
    Object.keys(colorFor).sort().map(s => `<option>${esc(s)}</option>`).join('');
  sel.value = cur; sel.disabled = false;
}

function applyFilter() {
  const s = $('filter').value;
  layer.clearLayers();
  records.forEach(r => { if (!s || (r.person['Status'] || 'Unknown') === s) r.marker.addTo(layer); });
}

let people = [], runId = 0;

function selectedState() { return STATES.find(s => s.code === $('state').value); }

async function render() {
  const id = ++runId;                    
  const st = selectedState();
  layer.clearLayers(); records = [];
  $('filter').value = '';
  if (!people.length) return;

  const subset = people.filter(p => !st || [st.code, ''].includes(stateCode(p)));
  const elsewhere = people.length - subset.length;
  let done = 0, failed = [], outside = 0;

  for (const p of subset) {
    if (id !== runId) return;
    setStatus(`Locating ${++done} of ${subset.length}…`);
    try {
      const ll = await locate(p);
      if (id !== runId) return;
      if (!ll) { failed.push(p['Full Name']); continue; }
      if (st && stateCode(p) === '' && !inBounds(ll, st.bounds)) { outside++; continue; }
      addRecord(p, ll); refreshFilter();
    } catch (e) { failed.push(p['Full Name']); console.warn(e); await sleep(2000); }
  }
  if (id !== runId) return;
  setStatus(`${records.length} mapped in ${st ? st.name : 'all locations'}` +
            (elsewhere + outside ? ` · ${elsewhere + outside} elsewhere` : '') +
            (failed.length ? ` · ${failed.length} not found` : ''));
  if (failed.length) console.warn('Could not locate:', failed);
}

$('state').onchange = () => {
  const st = selectedState();
  map.fitBounds(st ? st.bounds : US_BOUNDS);
  render();
};

$('load').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  people = parseCSV(await f.text()).filter(p => p['Full Name']);
  Object.keys(colorFor).forEach(k => delete colorFor[k]);
  $('export').disabled = false;
  e.target.value = '';
  render();
};
$('filter').onchange = applyFilter;

$('export').onclick = () => {
  const box = map.getContainer(), origin = box.getBoundingClientRect();
  const dpr = 2, canvas = document.createElement('canvas');
  canvas.width = origin.width * dpr; canvas.height = origin.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#e8ebe6'; ctx.fillRect(0, 0, origin.width, origin.height);

  box.querySelectorAll('.leaflet-tile-pane img.leaflet-tile').forEach(img => {
    if (!img.complete || !img.naturalWidth) return;
    const r = img.getBoundingClientRect();
    ctx.drawImage(img, r.left - origin.left, r.top - origin.top, r.width + 0.5, r.height + 0.5);
  });

  const shown = $('filter').value;
  records.forEach(r => {
    if (shown && (r.person['Status'] || 'Unknown') !== shown) return;
    const pt = map.latLngToContainerPoint(r.latlng);
    if (pt.x < -10 || pt.y < -10 || pt.x > origin.width + 10 || pt.y > origin.height + 10) return;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = r.color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  });

  ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right';
  const label = '© OpenStreetMap contributors', w = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(origin.width - w - 12, origin.height - 20, w + 12, 20);
  ctx.fillStyle = '#333'; ctx.fillText(label, origin.width - 6, origin.height - 6);

  try {
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = `people-map-${$('state').value}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  } catch (e) { setStatus('Export failed: map tiles were blocked from canvas use.'); }
};
</script>
</body>
</html>
